<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Democraz | Proposições</title>
    <meta
      name="description"
      content="Uma alternativa para o site do governo brasileiro da Câmara dos Deputados"
    />
    <style>
      :root {
        --primary: #2c3e50;
        --accent: #27ae60;
        --bg: #f4f7f6;
        --text: #333;
        --white: #ffffff;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.6;
        margin: 0;
        padding: 20px;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
        border-bottom: 3px solid var(--accent);
        padding-bottom: 20px;
      }

      h1 {
        color: var(--primary);
        margin-bottom: 5px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      .legislacao-card {
        background: var(--white);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s;
      }

      .legislacao-card:hover {
        transform: translateY(-3px);
      }

      .badge {
        display: inline-block;
        background: var(--primary);
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .ementa {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--primary);
        margin-top: 0;
      }

      .meta-info {
        display: flex;
        gap: 20px;
        font-size: 0.9rem;
        color: #666;
        border-top: 1px solid #eee;
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Democraz</h1>
      <p>Acesso simplificado aos dados da Câmara dos Deputados.</p>
    </header>

    <main class="container">
      {% for legislacao in data.dados %}
      <article class="legislacao-card">
        <span class="badge"
          >{{ legislacao.siglaTipo }} {{ legislacao.numero }}/{{ legislacao.ano
          }}</span
        >

        <h2 class="ementa">{{ legislacao.ementa }}</h2>

        <div class="meta-info">
          <span><strong>ID:</strong> {{ legislacao.id }}</span>
          <span
            ><strong>Apresentação:</strong> {{ legislacao.dataApresentacao[:10]
            }}</span
          >
        </div>
      </article>
      {% endfor %}
    </main>
  </body>
</html>
